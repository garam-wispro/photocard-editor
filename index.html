<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포토카드 에디터</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('pc_theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
/* 블랙 모드(기본 변수) */
:root{color-scheme:dark;--bg:#15161a;--panel:#1e2026;--line:#30333c;--fg:#e8e9ee;--mut:#9a9eab;--acc:#ff4d8d;--acc2:#3ec5ff;--in:#282b33;
  --stage1:#2a2c35;--stage2:#15161a;--hovb:#555a68;--hov:#30343e;--selbg:#3a2530;
  --okbg:#1d3327;--okfg:#7be0a4;--warnbg:#3b2a1a;--warnfg:#ffb866;--badbg:#3d1f24;--badfg:#ff8a8a;--pvbg:rgba(12,13,16,.97)}
/* 화이트 모드: 밝은 베이지 배경 */
:root[data-theme=light]{color-scheme:light;--bg:#f3ecdf;--panel:#fbf7ef;--line:#ddd1bc;--fg:#2b2622;--mut:#7c7265;--in:#ffffff;
  --stage1:#f8f3e9;--stage2:#eadfcb;--hovb:#c2b49b;--hov:#f4ede0;--selbg:#ffe3ec;
  --okbg:#dff3e6;--okfg:#1c7a44;--warnbg:#fdebd0;--warnfg:#9a5700;--badbg:#fde0e0;--badfg:#b02a2a;--pvbg:rgba(243,236,223,.98)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.45 "Noto Sans KR","Malgun Gothic",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
header h1{font-size:15px;margin:0 12px 0 0;letter-spacing:-.02em}
header h1 b{color:var(--acc)}
.sp{flex:1}
main{flex:1;display:flex;min-height:0}
aside{width:270px;flex:none;background:var(--panel);overflow-y:auto;padding:12px}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line);width:280px}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--stage1),var(--stage2) 75%)}
#cv{position:absolute;left:0;top:0;touch-action:none}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--mut);font-size:12px;pointer-events:none}
#hint i{font-style:normal;display:inline-block;margin:0 8px}
#hint .c1{color:var(--acc)}#hint .c2{color:var(--acc2)}
#drop{position:absolute;inset:12px;border:2px dashed var(--acc);border-radius:14px;background:rgba(255,77,141,.08);display:none;align-items:center;justify-content:center;font-size:18px;pointer-events:none}
#stage.over #drop{display:flex}
#strip{flex:none;height:122px;display:flex;background:var(--panel);border-top:1px solid var(--line)}
#stripCtl{flex:none;width:156px;padding:8px 10px;border-right:1px solid var(--line)}
#cardPos{font-weight:700;margin-bottom:6px}
#thumbs{flex:1;display:flex;gap:6px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:6px 10px}
.thumb{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 6px;border:2px solid transparent;border-radius:8px;cursor:pointer}
.thumb:hover{background:var(--in)}
.thumb.sel{border-color:var(--acc);background:var(--selbg)}
.thumb canvas{background:#fff;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.5);display:block}
.thumb span{font-size:11px;color:var(--mut)}
h2{font-size:11px;letter-spacing:.08em;color:var(--mut);margin:16px 0 8px;font-weight:700}
h2:first-child{margin-top:0}
button,select,input{font:inherit;color:inherit}
button{background:var(--in);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--hovb);background:var(--hov)}
button.on:hover,button.pri:hover{background:var(--acc);border-color:var(--acc)}
button:disabled{opacity:.35;cursor:default}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.pri:hover{filter:brightness(1.1)}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px}
.seg button:first-child{border-radius:7px 0 0 7px;margin-left:0}
.seg button:last-child{border-radius:0 7px 7px 0}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:11px}
label.c{display:flex;align-items:center;gap:6px;color:var(--fg);flex:none}
input[type=number],input[type=text],select{background:var(--in);border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;color:var(--fg)}
.full{width:100%;margin-bottom:6px}
.layer{display:flex;align-items:center;gap:4px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;cursor:pointer;background:var(--in)}
.layer.sel{border-color:var(--acc);background:var(--selbg)}
.layer.hid .nm{opacity:.4}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer button{padding:1px 6px;font-size:11px;border:none;background:transparent;color:var(--mut)}
.layer button:hover{color:var(--fg)}
.empty{color:var(--mut);padding:10px 0;font-size:12px}
.dpi{font-size:12px;padding:6px 8px;border-radius:6px;background:var(--okbg);color:var(--okfg);margin-bottom:8px}
.dpi.warn{background:var(--warnbg);color:var(--warnfg)}
.dpi.bad{background:var(--badbg);color:var(--badfg)}
.spec{font-size:12px;line-height:1.7;color:var(--mut);background:var(--in);border:1px solid var(--line);border-radius:7px;padding:7px 9px;margin-bottom:6px}
.spec b{color:var(--fg);font-weight:700}
small{color:var(--mut);display:block}
kbd{background:var(--in);border:1px solid var(--line);border-radius:4px;padding:0 4px;font:11px monospace}
#stripCtl{width:214px}
#stripCtl .row{margin:0;flex-wrap:nowrap}
#stripCtl .row button{padding:6px 4px}
.qty{display:flex;align-items:center;gap:5px;margin-bottom:6px}
.qty button{padding:4px 10px}
.qty input[type=number]{width:58px;text-align:center}
.backOpt{margin:6px 2px 12px}
.save{margin-top:16px;border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:10px;padding:12px;background:var(--in)}
.saveT{font-size:14px;font-weight:700;margin-bottom:10px}
.save label.f{display:block;font-size:12px;font-weight:700;color:var(--fg);margin-bottom:10px}
.save label.f em{font-style:normal;font-weight:400;font-size:11px;color:var(--acc)}
.save label.f input{display:block;margin-top:4px;font-weight:400}
.save .full{margin-bottom:8px}
#total{font-size:12px;color:var(--mut);text-align:center;margin:2px 0 8px}
#total:empty{display:none}
#expStatus{font-size:12px;color:var(--acc);margin:0 0 8px;text-align:center}
#expStatus:empty{display:none}
.dpiRow{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11px;color:var(--mut)}
.dpiRow select{width:auto;padding:2px 4px;font-size:11px;min-height:0}
#fab{display:none;position:absolute;left:8px;top:8px;z-index:2}
button{touch-action:manipulation}
#inapp{background:var(--warnbg);color:var(--warnfg);padding:8px 12px;font-size:13px;line-height:1.6}
#inapp button{padding:3px 8px;min-height:0;margin-left:4px}
#done{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#done[hidden]{display:none}
#done .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:360px}
#doneName{color:var(--mut);font-size:12px;margin:6px 0 12px;word-break:break-all}
#pv{position:fixed;inset:0;z-index:20;background:var(--pvbg);display:flex;flex-direction:column}
#pv[hidden]{display:none}
#pvBar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#pvSum{color:var(--mut);margin-left:6px}
#pvGrid{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:14px;padding:16px;align-content:flex-start;justify-content:center}
.pvCell{border:1px solid #ff9d2e;border-radius:12px;padding:10px 12px 12px;background:var(--panel)}
.pvCell h3{font-size:13px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.pvCell h3 em{font-style:normal;font-weight:400;color:var(--warnfg);font-size:11px}
.pvSides{display:flex;gap:10px;align-items:flex-start}
.pvSides figure{margin:0;text-align:center}
.pvSides canvas{display:block;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.pvSides figcaption{font-size:11px;color:var(--mut);margin-top:5px}
.pvEmpty{color:var(--mut);padding:40px 10px;text-align:center;width:100%}
/* 휴대폰·좁은 화면: 위에서 아래로 한 줄 배치, 페이지 전체가 스크롤 */
@media (max-width:820px){
  html,body{height:auto;min-height:100%}
  body{overflow:visible;display:block}
  header{flex-wrap:wrap;gap:6px;padding:6px 8px;position:sticky;top:0;z-index:5}
  .sp,.pc{display:none}
  header h1{flex-basis:100%;margin:0;font-size:14px}
  header button{padding:7px 9px}
  main{display:flex;flex-direction:column}
  #center{display:block;order:1;flex:none}
  #right{order:2}
  #left{order:3}
  #stage{height:56vh;min-height:300px}
  aside,#right{width:auto;border:none;border-top:1px solid var(--line);overflow:visible}
  #strip{display:block;height:auto}
  #stripCtl{width:auto;border-right:none;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  #cardPos,.qty{margin:0}
  #stripCtl .row{flex:1;min-width:190px}
  #thumbs{height:104px}
  #fab{display:block}
  button,select,input[type=number],input[type=text]{min-height:40px}
  input[type=number],input[type=text],select{font-size:16px}
  .layer button{min-height:0;padding:6px 9px;font-size:13px}
  label.c input{width:20px;height:20px;min-height:0}
}
</style>
</head>
<body>
<div id="inapp" hidden>앱 안의 화면에서는 파일 저장이 안 될 수 있습니다. 크롬이나 사파리에서 열어 주세요.
  <button id="inappBtn" hidden>기본 브라우저로 열기</button> <button id="inappCopy">주소 복사</button></div>
<header>
  <h1><b>포토카드</b> 에디터</h1>
  <div class="seg" id="sideSeg"><button data-side="front" class="on">앞면</button><button data-side="back">뒷면</button></div>
  <button id="undo" title="Ctrl+Z">↶ 실행 취소</button>
  <button id="redo" title="Ctrl+Y">↷ 다시 실행</button>
  <div class="sp"></div>
  <div class="seg" id="themeSeg" title="작업 화면 색"><button data-t="light">화이트</button><button data-t="dark">블랙</button></div>
  <button id="tgGuide" class="on">가이드선</button>
  <button id="tgPrev" class="pri" title="전체 카드가 재단 후 어떻게 나오는지 보기">전체 미리보기</button>
</header>
<main>
<aside id="left">
  <h2>이 카드의 방향</h2>
  <div class="seg" id="orientSeg" style="display:flex;margin-bottom:8px"><button data-o="portrait" style="flex:1">▯ 세로형</button><button data-o="landscape" style="flex:1">▭ 가로형</button></div>
  <div class="spec" id="spec"></div>
  <button class="full" id="orientAll">모든 카드를 이 방향으로</button>

  <h2>이미지</h2>
  <button id="addCards" class="pri full">🖼 이미지 추가하기</button>
  <input type="file" id="fileCards" accept="image/*" multiple hidden>
  <label class="c backOpt"><input type="checkbox" id="commonBack">모든 카드가 같은 뒷면 사용</label>
  <button class="pri full" id="pvBtn">🔍 전체 미리보기</button>

  <div class="save">
    <div class="saveT">저장하기</div>
    <label class="f">주문자명 <em>(필수)</em><input type="text" id="oname" maxlength="20" placeholder="주문하신 분 성함" autocomplete="name"></label>
    <label class="f">주문번호 <em>(필수)</em><input type="text" id="ono" maxlength="30" placeholder="쇼핑몰 주문번호" inputmode="numeric"></label>
    <div id="total"></div>
    <button class="pri full" id="expAll">전체 카드 EPS 받기 (ZIP)</button>
    <div id="expStatus"></div>
    <label class="dpiRow">해상도<select id="dpi"><option value="300">300 dpi</option><option value="600">600 dpi</option></select></label>
  </div>
</aside>

<section id="center">
  <div id="stage">
    <canvas id="cv"></canvas>
    <button id="fab" class="pri">＋ 이미지</button>
    <div id="drop">이미지를 여기에 놓으세요</div>
    <div id="hint"></div>
  </div>
  <div id="strip">
    <div id="stripCtl">
      <div id="cardPos"></div>
      <div class="qty" title="이 카드를 몇 장 인쇄할지"><span>수량</span><button id="qMinus">−</button><input type="number" id="qty" min="1" max="9999" value="1" inputmode="numeric"><button id="qPlus">＋</button><span>장</span></div>
      <div class="row"><button id="cAdd">+ 카드</button><button id="cDel">삭제</button><button id="cLeft" title="순서를 앞으로">◀</button><button id="cRight" title="순서를 뒤로">▶</button></div>
    </div>
    <div id="thumbs"></div>
  </div>
</section>

<aside id="right">
  <h2>선택한 이미지</h2>
  <div id="props"></div>
  <h2>이 면의 이미지</h2>
  <div id="layers"></div>
</aside>
</main>

<div id="done" hidden><div class="box">
  <b>파일이 준비됐습니다</b>
  <div id="doneName"></div>
  <button class="pri full" id="doneSave">파일 저장</button>
  <button class="full" id="doneShare" hidden>공유하기 (카톡·메일 등)</button>
  <small>저장한 ZIP 파일을 주문하신 곳으로 보내 주세요.</small>
  <button class="full" id="doneClose" style="margin-top:8px">닫기</button>
</div></div>

<div id="pv" hidden>
  <div id="pvBar"><div><b>전체 미리보기</b> <span id="pvSum"></span></div><button id="pvClose" class="pri">닫기 ✕</button></div>
  <div id="pvGrid"></div>
</div>

<script>
// 새 버전이 올라왔는데 브라우저가 옛 화면을 기억하고 있으면, 열자마자 한 번 새로 받아 온다
(()=>{if(!/^https?:$/.test(location.protocol))return;
  fetch(location.pathname,{method:'HEAD',cache:'no-store'}).then(r=>{const lm=Date.parse(r.headers.get('last-modified')||''),cur=Date.parse(document.lastModified);
    if(!lm||!cur||lm-cur<3000)return;const key='pc_ver_'+lm;try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch{return}
    location.replace(location.pathname+'?v='+lm)}).catch(()=>{})})();
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage'),props=$('#props'),layersEl=$('#layers'),thumbsEl=$('#thumbs');
const SPEC={L:85.5,S:54,FL:86.5,FS:54.9,radius:3}; // 고정 규격: 재단 85.5×54, 작업(이미지) 86.5×54.9, 타공 없음
const BL=(SPEC.FL-SPEC.L)/2,BS=(SPEC.FS-SPEC.S)/2; // 재단선 바깥 여유: 긴 변 방향 0.5, 짧은 변 방향 0.45
const KO={portrait:'세로형',landscape:'가로형'};
let uidN=0;const uid=()=>'i'+Date.now().toString(36)+(uidN++).toString(36);
const blank=()=>({layers:[]});
const newCard=o=>({id:uid(),orient:o,qty:1,front:blank(),back:blank()});
const qtyOf=c=>Math.min(9999,Math.max(1,Math.floor(+c.qty)||1));
const COARSE=matchMedia('(pointer:coarse)').matches,HR=COARSE?22:11,HS=COARSE?8:5; // 손가락용으로 조절점을 크게
const MAXPX=COARSE?2600:4000; // 보관하는 이미지의 긴 변 최대 픽셀(600dpi 인쇄에 필요한 2043px보다 충분히 큼)
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){ // 구형 휴대폰 브라우저용
  r=Math.max(0,Math.min(+r||0,w/2,h/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
let state={cards:[newCard('portrait')],commonBack:false,common:{portrait:blank(),landscape:blank()}};
const assets={}; // id → {blob,img}
let ci=0,side='front',selId=null,showGuides=true,preview=false,drag=null,snapV=false,snapH=false,hist=[],hi=-1,stripSig='',busy=false;
const rad=d=>d*Math.PI/180;
const dims=o=>o==='landscape'?{W:SPEC.L,H:SPEC.S,FW:SPEC.FL,FH:SPEC.FS,bx:BL,by:BS}:{W:SPEC.S,H:SPEC.L,FW:SPEC.FS,FH:SPEC.FL,bx:BS,by:BL};
const card=()=>state.cards[ci];
const D=()=>dims(card().orient);
const sideOf=(c,s)=>s==='back'&&state.commonBack?state.common[c.orient]:c[s];
const cur=()=>sideOf(card(),side);
const sel=()=>cur().layers.find(l=>l.id===selId)||null;
const sigNow=()=>state.cards.map(c=>c.id+c.orient).join('|');

/* ---------- 히스토리 ---------- */
function commit(){hist=hist.slice(0,hi+1);hist.push(JSON.stringify({state,ci}));if(hist.length>60)hist.shift();hi=hist.length-1;histBtns();thumbCur()}
function restore(){const s=JSON.parse(hist[hi]);state=s.state;ci=Math.min(s.ci,state.cards.length-1);stripSig='';refresh();histBtns()}
function undo(){if(hi>0){hi--;restore()}}
function redo(){if(hi<hist.length-1){hi++;restore()}}
function histBtns(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}

/* ---------- 그리기 ---------- */
const AR=l=>l.ar||1,SY=l=>l.scale*AR(l),LOCK=l=>l.lock!==false,CROP=l=>l.crop||{x:0,y:0,w:1,h:1}; // 세로 늘림 비율 · 세로 배율 · 비율 고정 여부 · 자르기 영역(원본 대비 0~1)
let cropMode=false,cropFor=null;
function grayOf(a){if(a.gray)return a.gray; // 흑백본을 직접 만들어 둔다(아이폰 사파리는 canvas filter 미지원)
  const c=document.createElement('canvas');c.width=a.w;c.height=a.h;const x=c.getContext('2d');x.drawImage(a.img,0,0,a.w,a.h);
  const d=x.getImageData(0,0,a.w,a.h),p=d.data;for(let i=0;i<p.length;i+=4){const v=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(d,0,0);return a.gray=c}
function drawLayer(c,l){const a=assets[l.asset];if(!a)return;
  c.save();c.translate(l.x,l.y);c.rotate(rad(l.rot));c.scale(l.scale*(l.flipX?-1:1),SY(l));const k=CROP(l);
  c.drawImage(l.gray?grayOf(a):a.img,k.x*a.w,k.y*a.h,k.w*a.w,k.h*a.h,-l.w/2,-l.h/2,l.w,l.h);c.restore()}
function drawCard(c,k,ox,oy,sd,clip,dm){const {W,H,FW,FH,bx,by}=dm;
  c.save();c.translate(ox,oy);c.scale(k,k);c.beginPath();
  if(clip==='trim')c.roundRect(0,0,W,H,SPEC.radius);else c.rect(-bx,-by,FW,FH);
  c.clip();c.fillStyle='#ffffff';c.fillRect(-bx,-by,FW,FH);
  for(const l of sd.layers)if(!l.hidden)drawLayer(c,l);
  c.restore()}
function view(){const r=stage.getBoundingClientRect(),{W,H,FW,FH}=D();
  const k=Math.max(.5,Math.min((r.width-(r.width<500?44:90))/FW,(r.height-(r.width<500?84:100))/FH));

function corners(l){const c=Math.cos(rad(l.rot)),s=Math.sin(rad(l.rot)),hw=l.w*l.scale/2,hh=l.h*SY(l)/2;

function handles(l,v){const cs=corners(l).map(p=>({x:v.ox+p.x*v.k,y:v.oy+p.y*v.k}));

  const es=cs.map((p,i)=>{const q=cs[(i+1)%4];return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}}); // 변 가운데 점: 위·오른쪽·아래·왼쪽
  return{cs,es,tm,rot:{x:tm.x+Math.sin(a)*26,y:tm.y-Math.cos(a)*26}}}
function render(){

    if(cropMode&&a){const F=frameOf(l);ctx.save();ctx.translate(v.ox,v.oy);ctx.scale(k,k);ctx.translate(F.cx,F.cy);ctx.rotate(rad(l.rot));ctx.scale(l.flipX?-1:1,1);
      ctx.globalAlpha=.32;ctx.drawImage(l.gray?grayOf(a):a.img,-F.fw/2,-F.fh/2,F.fw,F.fh);ctx.restore()} // 잘려 나간 부분을 흐리게 보여 준다
    ctx.save();ctx.strokeStyle=cropMode?'#ff9d00':'#ff4d8d';ctx.lineWidth=cropMode?2:1.5;if(cropMode)ctx.setLineDash([6,4]);ctx.beginPath();
    h.cs.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    if(!cropMode){ctx.beginPath();ctx.moveTo(h.tm.x,h.tm.y);ctx.lineTo(h.rot.x,h.rot.y);ctx.stroke()}

/* ---------- 이미지·레이어 ---------- */
function fit(l,mode,dm){const {W,H,FW,FH}=dm||D();
  const hh=l.h*AR(l);l.scale=mode==='cover'?Math.max(FW/l.w,FH/hh):Math.min(W/l.w,H/hh);l.x=W/2;l.y=H/2;l.rot=0}
function fitAxis(l,ax){const {W,H,FW,FH}=D(),a=rad(l.rot),c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a)); // 작업 사이즈의 가로폭/세로폭에 딱 맞춤(회전 반영)
  const hh=l.h*AR(l);if(ax==='w'){l.scale=FW/(l.w*c+hh*s);l.x=W/2}else{l.scale=FH/(l.w*s+hh*c);l.y=H/2}}
// 자르기: 원본 전체가 카드 위에 놓인 틀(F)을 기준으로, 남길 영역(R, 원본 대비 0~1)만 바꾼다. 그림은 제자리에 있고 보이는 창만 달라진다.
function frameOf(l){const k=CROP(l),fw=l.w*l.scale/k.w,fh=l.h*SY(l)/k.h,c=Math.cos(rad(l.rot)),s=Math.sin(rad(l.rot));
  const ox=(.5-(k.x+k.w/2))*fw*(l.flipX?-1:1),oy=(.5-(k.y+k.h/2))*fh;return{fw,fh,cx:l.x+ox*c-oy*s,cy:l.y+ox*s+oy*c}}
function applyCrop(l,F,R){const cw=R.x1-R.x0,ch=R.y1-R.y0,c=Math.cos(rad(l.rot)),s=Math.sin(rad(l.rot));
  l.crop={x:R.x0,y:R.y0,w:cw,h:ch};l.w=F.fw*cw/l.scale;l.h=F.fh*ch/SY(l);
  const ox=((R.x0+R.x1)/2-.5)*F.fw*(l.flipX?-1:1),oy=((R.y0+R.y1)/2-.5)*F.fh;l.x=F.cx+ox*c-oy*s;l.y=F.cy+ox*s+oy*c}
function normPt(l,F,p){const dx=p.x-F.cx,dy=p.y-F.cy,c=Math.cos(rad(-l.rot)),s=Math.sin(rad(-l.rot));let lx=dx*c-dy*s;if(l.flipX)lx=-lx;
  return{nx:lx/F.fw+.5,ny:(dx*s+dy*c)/F.fh+.5}}
function addImage(blob){return new Promise(res=>{const url=URL.createObjectURL(blob),img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,src=img;const s=Math.min(1,MAXPX/Math.max(w,h));
    if(s<1){w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h; // 큰 사진은 줄여서 보관(휴대폰 메모리 보호)
      const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);src=c;URL.revokeObjectURL(url)}
    const id=uid();assets[id]={img:src,w,h};
    const l={id:uid(),asset:id,x:0,y:0,w:w/300*25.4,h:h/300*25.4,scale:1,rot:0,flipX:false,hidden:false,gray:false};
    fit(l,'cover');cur().layers.push(l);selId=l.id;res(true)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(false)};img.src=url})}
const onlyImages=files=>files.filter(f=>f.type.startsWith('image/'));
async function addToCard(files){let bad=0;for(const f of onlyImages(files))if(!await addImage(f))bad++;
  commit();refresh();if(bad)alert(`읽을 수 없는 이미지 ${bad}개는 제외했습니다.`)}
async function addAsCards(files){const imgs=onlyImages(files);if(!imgs.length)return;
  const o=card().orient;let bad=0,useCur=!card().front.layers.length,made=false;side='front';
  for(const f of imgs){
    if(!useCur){state.cards.push(newCard(o));ci=state.cards.length-1;made=true}
    if(await addImage(f)){useCur=false;made=false}else{bad++;useCur=true}}
  if(useCur&&made){state.cards.pop();ci=state.cards.length-1} // 읽기 실패로 비어 있는 새 카드는 버린다
  selId=null;commit();refresh();if(bad)alert(`읽을 수 없는 이미지 ${bad}개는 제외했습니다.`)}
function removeSel(){const a=cur().layers,i=a.findIndex(l=>l.id===selId);if(i<0)return;a.splice(i,1);selId=null;commit();refresh()}
function moveZ(id,d){const a=cur().layers,i=a.findIndex(l=>l.id===id),j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];commit();refresh()}

/* ---------- 카드(여러 장) ---------- */
function selectCard(i){if(i<0||i>=state.cards.length||i===ci)return;ci=i;selId=null;refresh()}
function addCard(){state.cards.splice(ci+1,0,newCard(card().orient));ci++;side='front';selId=null;commit();refresh()}
function delCard(){if(state.cards.length===1)state.cards[0]=newCard(card().orient);else{state.cards.splice(ci,1);ci=Math.min(ci,state.cards.length-1)}selId=null;commit();refresh()}
function moveCard(d){const j=ci+d,a=state.cards;if(j<0||j>=a.length)return;[a[ci],a[j]]=[a[j],a[ci]];ci=j;commit();refresh()}
function reorient(c,o){if(c.orient===o)return;const od=dims(c.orient),nd=dims(o),e=.05;
  for(const s of[c.front,c.back])for(const l of s.layers){const hw=l.w*l.scale/2,hh=l.h*SY(l)/2; // 꽉 채우던 이미지는 전환 후에도 꽉 채운다
    const full=l.rot===0&&l.x-hw<=-od.bx+e&&l.x+hw>=od.W+od.bx-e&&l.y-hh<=-od.by+e&&l.y+hh>=od.H+od.by-e;
    if(full)fit(l,'cover',nd);else{l.x=l.x/od.W*nd.W;l.y=l.y/od.H*nd.H}}
  c.orient=o}
function drawThumb(el,c){const {W,H}=dims(c.orient),k=70/SPEC.L,dpr=2;
  el.width=Math.round(W*k*dpr);el.height=Math.round(H*k*dpr);el.style.width=W*k+'px';el.style.height=H*k+'px';
  drawCard(el.getContext('2d'),k*dpr,0,0,c.front,'trim',dims(c.orient))}
function thumbCur(){const el=thumbsEl.children[ci];if(el&&stripSig===sigNow())drawThumb(el.firstChild,card())}
function syncStrip(){const sig=sigNow();
  if(sig!==stripSig){stripSig=sig;
    thumbsEl.innerHTML=state.cards.map((c,i)=>`<div class="thumb" data-i="${i}"><canvas></canvas><span></span></div>`).join('');
    state.cards.forEach((c,i)=>drawThumb(thumbsEl.children[i].firstChild,c))}
  else thumbCur();
  [...thumbsEl.children].forEach((el,i)=>{el.classList.toggle('sel',i===ci);el.lastChild.textContent=`${i+1}번 · ${qtyOf(state.cards[i])}장`});
  const el=thumbsEl.children[ci];if(el)thumbsEl.scrollLeft=Math.max(0,el.offsetLeft-thumbsEl.offsetLeft-(thumbsEl.clientWidth-el.offsetWidth)/2);
  $('#cardPos').textContent=`카드 ${ci+1} / 총 ${state.cards.length}종`;$('#cLeft').disabled=ci===0;$('#cRight').disabled=ci===state.cards.length-1;
  const q=$('#qty');if(q!==document.activeElement)q.value=qtyOf(card())}
function setQty(v){const q=Math.min(9999,Math.max(1,Math.floor(+v)||1));if(q===qtyOf(card())&&card().qty===q)return refresh();card().qty=q;commit();refresh()}

/* ---------- UI ---------- */
const num=(v,m=1)=>Math.round(v*m*100)/100;
function F(label,k,o={}){return `<label class="f">${label}<input type="number" data-k="${k}" data-m="${o.m||1}" ${o.min!=null?`min="${o.min}"`:''} step="${o.step||1}"></label>`}
const FIELDS={ // 화면 입력칸 ↔ 이미지 값. 위치는 카드 정가운데가 0
  px:{get:l=>l.x-D().W/2,set:(l,v)=>{l.x=v+D().W/2}},py:{get:l=>l.y-D().H/2,set:(l,v)=>{l.y=v+D().H/2}},
  sw:{get:l=>l.w*l.scale,set:(l,v)=>{const h0=l.h*SY(l);l.scale=Math.max(.5,v)/l.w;if(!LOCK(l))l.ar=h0/(l.h*l.scale)}},
  sh:{get:l=>l.h*SY(l),set:(l,v)=>{v=Math.max(.5,v);if(LOCK(l))l.scale=v/(l.h*AR(l));else l.ar=v/(l.h*l.scale)}},
  rot:{get:l=>l.rot,set:(l,v)=>{l.rot=v}}};
function buildProps(){
  if(!sel()){props.innerHTML='<div class="empty">이미지를 추가하면 여기서 위치와 크기를 조절할 수 있습니다.</div>';return}
  props.innerHTML=`<div class="dpi" id="dpiInfo"></div>
  <div class="row"><button data-act="cover">카드 채우기</button><button data-act="contain">전체 보이기</button></div>
  <div class="row">${F('가로 위치(mm)','px',{step:.5})}${F('세로 위치(mm)','py',{step:.5})}</div>
  <small style="margin:-2px 0 6px">0 / 0 = 카드 정가운데 (＋는 오른쪽·아래)</small>
  <div class="row">${F('가로 크기(mm)','sw',{step:.5,min:1})}${F('세로 크기(mm)','sh',{step:.5,min:1})}</div>
  <div class="row" style="align-items:flex-end"><label class="c" style="padding-bottom:6px"><input type="checkbox" data-k="lock">비율 고정</label>${F('회전(°)','rot')}</div>
  <div class="row"><button data-act="crop" class="${cropMode?'on':''}">${cropMode?'자르기 끝내기':'✂ 자르기'}</button><button data-act="uncrop">자르기 해제</button></div>
  ${cropMode?'<small style="margin:-2px 0 6px;color:var(--warnfg)">노란 점을 끌어 남길 부분을 정하세요.</small>':''}
  <div class="row"><label class="c"><input type="checkbox" data-k="gray">흑백</label></div>
  <div class="row"><button data-act="cH">가로 중앙</button><button data-act="cV">세로 중앙</button></div>
  <div class="row"><button data-act="fitW">가로폭 맞추기</button><button data-act="fitH">세로폭 맞추기</button></div>
  <div class="row"><button data-act="flip">좌우 반전</button><button data-act="del">삭제</button></div>`;
  syncProps()}
function syncProps(skip){const l=sel();if(!l)return;
  props.querySelectorAll('[data-k]').forEach(el=>{if(el===skip)return;const k=el.dataset.k;
    if(el.type==='checkbox')el.checked=k==='lock'?LOCK(l):!!l[k];else if(el!==document.activeElement)el.value=num(FIELDS[k].get(l))});
  const d=$('#dpiInfo');
  if(d){const dpi=Math.round(300/Math.max(l.scale,SY(l)));d.className='dpi'+(dpi<200?' bad':dpi<280?' warn':'');
    d.textContent=`유효 해상도 ${dpi} dpi`+(dpi<200?' — 인쇄 시 흐릿합니다':dpi<280?' — 다소 낮음(권장 300 이상)':' — 인쇄 적합')}}
function buildLayers(){const a=cur().layers;
  if(!a.length){layersEl.innerHTML='<div class="empty">이미지가 없습니다.</div>';return}
  layersEl.innerHTML=[...a].reverse().map((l,i)=>`<div class="layer${l.id===selId?' sel':''}${l.hidden?' hid':''}" data-id="${l.id}"><span class="nm">🖼 이미지 ${a.length-i}</span>
    <button data-la="vis" title="표시/숨김">${l.hidden?'○':'●'}</button><button data-la="up" title="앞으로">▲</button><button data-la="down" title="뒤로">▼</button><button data-la="del" title="삭제">✕</button></div>`).join('')}
function syncCard(){
  const {W,H,FW:fw,FH:fh}=D(),dpi=+$('#dpi').value,px=mm=>Math.round(mm/25.4*dpi);
  document.querySelectorAll('#orientSeg button').forEach(x=>x.classList.toggle('on',x.dataset.o===card().orient));
  $('#spec').innerHTML=`재단 사이즈 <b>${W}×${H}mm</b><br>이미지 사이즈 <b>${fw}×${fh}mm</b><br>모서리 R${SPEC.radius}mm · 타공 없음<br>타공이 필요하면 따로 문의해 주세요.`;
  const t=totals();$('#total').textContent=t.kinds?`${t.kinds}종 · 총 ${t.total}장 (단면 ${t.single}장, 양면 ${t.dbl}장)`:'';
  document.querySelectorAll('#sideSeg button').forEach(x=>{x.classList.toggle('on',x.dataset.side===side);if(x.dataset.side==='back')x.textContent=state.commonBack?'뒷면(공통)':'뒷면'});

function refresh(){if(selId&&!sel())selId=null;
  if(!selId){const a=cur().layers.filter(l=>!l.hidden);if(a.length)selId=a[a.length-1].id} // 클릭하지 않아도 맨 위 이미지를 바로 조작
  if(cropMode&&cropFor!==selId)cropMode=false;
  syncCard();buildProps();buildLayers();syncStrip();render()}

props.addEventListener('input',e=>{const t=e.target,l=sel(),k=t.dataset.k;if(!l||!k)return;let v;
  if(t.type==='checkbox')l[k]=t.checked;else{v=parseFloat(t.value);if(isNaN(v))return;FIELDS[k].set(l,v)}
  syncProps(t);render()});
props.addEventListener('change',e=>{if(e.target.dataset.k)commit()});
props.addEventListener('click',e=>{const a=e.target.dataset.act,l=sel();if(!a||!l)return;
  if(a==='del')return removeSel();
  if(a==='crop'){cropMode=!cropMode;cropFor=l.id;return refresh()}
  if(a==='uncrop')applyCrop(l,frameOf(l),{x0:0,y0:0,x1:1,y1:1});else
  if(a==='cover'||a==='contain')fit(l,a);else if(a==='cH')l.x=D().W/2;else if(a==='cV')l.y=D().H/2;else if(a==='flip')l.flipX=!l.flipX;else if(a==='fitW')fitAxis(l,'w');else if(a==='fitH')fitAxis(l,'h');

  if(la==='vis'){const l=cur().layers.find(x=>x.id===id);l.hidden=!l.hidden;commit();refresh()}
  else if(la==='up')moveZ(id,1);else if(la==='down')moveZ(id,-1);
  else if(la==='del'){selId=id;removeSel()}else{selId=id;refresh()}});

/* ---------- 캔버스 포인터 ---------- */
function evPt(e){const r=cv.getBoundingClientRect(),v=view(),sx=e.clientX-r.left,sy=e.clientY-r.top;return{sx,sy,x:(sx-v.ox)/v.k,y:(sy-v.oy)/v.k,v}}
function hitTest(p){const a=cur().layers;for(let i=a.length-1;i>=0;i--){const l=a[i];if(l.hidden)continue;
  const dx=p.x-l.x,dy=p.y-l.y,c=Math.cos(rad(-l.rot)),s=Math.sin(rad(-l.rot)),lx=(dx*c-dy*s)/l.scale,ly=(dx*s+dy*c)/SY(l);

function hitHandle(l,p){const h=handles(l,p.v),near=(q,r)=>Math.hypot(q.x-p.sx,q.y-p.sy)<=r;
  if(!cropMode&&near(h.rot,HR))return{t:'rot'};
  let i=h.cs.findIndex(q=>near(q,HR));if(i>=0)return{t:'corner',i};
  if(cropMode||!LOCK(l)){i=h.es.findIndex(q=>near(q,HR));if(i>=0)return{t:'edge',i}}

const pts=new Map();let pinch=null; // 두 손가락 벌리기·오므리기로 크기 조절
const pinchDist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
cv.addEventListener('pointerdown',e=>{
  if(preview||busy||e.button!==0)return;

  let file=null,can=false;try{file=new File([blob],name,{type:'application/zip'});can=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch{}
  $('#doneName').textContent=name;$('#doneSave').onclick=()=>download(blob,name);
  $('#doneShare').hidden=!can;$('#doneShare').onclick=()=>navigator.share({files:[file],title:name}).catch(()=>{});
  $('#done').hidden=false}
const ZIP_PW='123123'; // 내려받는 ZIP의 압축 암호
const status=t=>{$('#expStatus').textContent=t};
const pad=i=>String(i+1).padStart(Math.max(2,String(state.cards.length).length),'0');
const hasBack=c=>(state.commonBack?state.common[c.orient]:c.back).layers.length>0;
function totals(){let kinds=0,total=0,single=0,dbl=0; // 앞면 이미지가 있는 카드만 센다
  for(const c of state.cards){if(!c.front.layers.length)continue;kinds++;const q=qtyOf(c);total+=q;if(hasBack(c))dbl+=q;else single+=q}
  return{kinds,total,single,dbl}}
function exportPlan(){const cards=[],rows=[];
  state.cards.forEach((c,i)=>{if(!c.front.layers.length)return;const q=qtyOf(c),dbl=hasBack(c),no=pad(i);
    cards.push({c,no,q,dbl});rows.push(`${no}번 | ${KO[c.orient]} | ${dbl?'양면':'단면'} | ${q}장 | 대지 ${no}_앞면${dbl?` + ${no}_뒷면`:''}`)});
  return{cards,rows}}
const cleanName=s=>s.replace(/[\/:*?"<>|()\x00-\x1f]/g,'').trim().slice(0,30);
async function exportAll(){
  if(busy)return;const dpi=+$('#dpi').value,{cards,rows}=exportPlan(),name=cleanName($('#oname').value),ono=cleanName($('#ono').value);
  if(!cards.length)return alert('내보낼 내용이 없습니다. 카드 앞면에 이미지를 먼저 넣어 주세요.');
  if(!name){alert('주문자명을 입력해 주세요.');$('#oname').focus();return}
  if(!ono){alert('주문번호를 입력해 주세요.');$('#ono').focus();return}
  const nArts=cards.reduce((a,x)=>a+(x.dbl?2:1),0);
  if(nArts*(SPEC.FL/25.4*dpi)*(SPEC.FS/25.4*dpi)*3>3.8e9)return alert('한 번에 받기에는 용량이 너무 큽니다(4GB 초과). 300dpi로 낮추거나 카드를 나누어 내보내 주세요.');
  busy=true;
  try{const t=totals(),cells=[],common={};
    for(let i=0;i<cards.length;i++){const {c,no,q,dbl}=cards[i];status(`대지 만드는 중… ${i+1} / ${cards.length}`);await new Promise(r=>setTimeout(r,0));
      const arts=[{...artOf(c.front,c.orient,dpi),name:no+'_앞면'}];
      if(dbl){const b=state.commonBack?(common[c.orient]||(common[c.orient]=artOf(state.common[c.orient],c.orient,dpi))):artOf(c.back,c.orient,dpi);arts.push({...b,name:no+'_뒷면'})}
      cells.push({label:textImg(`${dbl?'양면':'단면'} ${q}장`,56),arts})}
    status('파일로 묶는 중…');await new Promise(r=>setTimeout(r,0));
    const sum=`${t.kinds}종 · 총 ${t.total}장 (단면 ${t.single}장, 양면 ${t.dbl}장)`,n=new Date(),p2=v=>String(v).padStart(2,'0');
    const header=textImg(`주문자 ${name}  ·  주문번호 ${ono}  ·  ${sum}`,48),base=`포토카드_${name}_${ono}_${t.kinds}종_${t.total}장`;
    const sheet=['[포토카드 주문 내역]',`주문자명: ${name}`,`주문번호: ${ono}`,`작성일시: ${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())} ${p2(n.getHours())}:${p2(n.getMinutes())}`,
      `규격: 재단 ${SPEC.L}×${SPEC.S}mm / 대지 ${SPEC.FL}×${SPEC.FS}mm / 모서리 R${SPEC.radius}mm / 타공 없음`,`합계: ${sum}`,`해상도: ${dpi}dpi`,
      '세로형 카드는 대지에 시계 반대 방향으로 90° 돌려 넣었습니다(카드 윗부분이 대지 왼쪽).','','번호 | 방향 | 인쇄 | 수량 | 대지',...rows,''].join('\r\n');
    const files=[{name:base+'.eps',data:buildSheet(cells,header,'photocard','eps')},{name:'주문내역.txt',data:new TextEncoder().encode('﻿'+sheet)}];
    deliver(zipStore(files,ZIP_PW),base+'.zip');status(`완료: 대지 ${nArts}개가 들어간 EPS와 주문내역을 암호가 걸린 ZIP으로 저장했습니다.`)}
  catch(err){status('');alert('내보내기 실패: '+err.message)}
  finally{busy=false}}
$('#expAll').onclick=exportAll;
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('pc_theme',t)}catch{}
  document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render()}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
$('#doneClose').onclick=()=>{$('#done').hidden=true};
// 카카오톡 등 앱 안의 화면에서는 파일 저장이 막히는 경우가 많다 → 기본 브라우저로 안내
(()=>{const ua=navigator.userAgent,kakao=/KAKAOTALK/i.test(ua);if(!kakao&&!/NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua))return;
  $('#inapp').hidden=false;
  $('#inappCopy').onclick=()=>{try{navigator.clipboard.writeText(location.href).then(()=>{$('#inappCopy').textContent='복사됨'})}catch{}};
  if(kakao){const go=()=>{location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href)};
    $('#inappBtn').hidden=false;$('#inappBtn').onclick=go;
    try{if(!sessionStorage.getItem('pc_ext')){sessionStorage.setItem('pc_ext','1');go()}}catch{}}})();
$('#fab').onclick=()=>$('#fileCards').click();
$('#qMinus').onclick=()=>setQty(qtyOf(card())-1);$('#qPlus').onclick=()=>setQty(qtyOf(card())+1);
$('#qty').onchange=e=>setQty(e.target.value);
try{$('#oname').value=localStorage.getItem('pc_oname')||''}catch{}
$('#oname').oninput=e=>{try{localStorage.setItem('pc_oname',e.target.value)}catch{}};

/* ---------- 시작 ---------- */
new ResizeObserver(render).observe(stage);
setTheme(document.documentElement.dataset.theme==='dark'?'dark':'light');
commit();refresh();
</script>
